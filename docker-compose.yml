# The API/WebSocket server runs on the host (not in Docker). To start the server and Compose together:
#   bun run docker:stack -- up
# Or start the server yourself (`bun dev:server`) before `docker compose up`.
# The server must listen on the host (default port 3773) so nginx can reach it via host.docker.internal.
# Override with T3_SERVER_UPSTREAM in a `.env` file next to this compose file (e.g. host.docker.internal:3773).
services:
  nginx:
    image: nginx:alpine
    container_name: t3-nginx
    depends_on:
      webui:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      T3_SERVER_UPSTREAM: ${T3_SERVER_UPSTREAM:-host.docker.internal:3773}
      T3_WEB_UI_USER: ""
      T3_WEB_UI_PASSWORD: ""
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - t3_ssl:/etc/ssl/klive
    command:
      - /bin/sh
      - -lc
      - |
        SERVER_UPSTREAM="$${T3_SERVER_UPSTREAM:-host.docker.internal:3773}"
        WEB_USER="$${T3_WEB_UI_USER}"
        WEB_PASS="$${T3_WEB_UI_PASSWORD}"

        if [ ! -f /etc/ssl/klive/server.crt ] || [ ! -f /etc/ssl/klive/server.key ]; then
          apk add --no-cache openssl >/dev/null 2>&1 || true
          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout /etc/ssl/klive/server.key \
            -out /etc/ssl/klive/server.crt \
            -days 3650 \
            -subj "/CN=localhost" >/dev/null 2>&1
        fi

        # Generate htpasswd and basic-auth nginx snippet if credentials are set
        AUTH_SNIPPET=""
        if [ -n "$$WEB_USER" ] && [ -n "$$WEB_PASS" ]; then
          apk add --no-cache apache2-utils >/dev/null 2>&1 || true
          htpasswd -cb /etc/nginx/.htpasswd "$$WEB_USER" "$$WEB_PASS"
          AUTH_SNIPPET='auth_basic "T3 Code"; auth_basic_user_file /etc/nginx/.htpasswd;'

          # Pre-compute the Base64 Authorization header so nginx can forward it
          # to the upstream server on WebSocket upgrades (browsers cannot send
          # custom headers on WebSocket connections).
          AUTH_HEADER="Basic $$(printf '%s:%s' "$$WEB_USER" "$$WEB_PASS" | base64)"
        fi

        cat <<'NGXEOF' >/etc/nginx/conf.d/default.conf
        server {
            listen 80;
            server_name _;
            return 301 https://$$host$$request_uri;
        }

        server {
            listen 443 ssl;
            server_name _;

            ssl_certificate /etc/ssl/klive/server.crt;
            ssl_certificate_key /etc/ssl/klive/server.key;
            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_ciphers HIGH:!aNULL:!MD5;

            __T3_AUTH_SNIPPET__

            proxy_http_version 1.1;
            proxy_set_header Host $$host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            location /ws {
                proxy_pass http://__T3_SERVER_UPSTREAM__;
                proxy_set_header Upgrade $$http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Authorization "__T3_AUTH_HEADER__";
            }

            location /attachments/ {
                proxy_pass http://__T3_SERVER_UPSTREAM__;
            }

            location /api/github/webhook {
                auth_basic off;
                proxy_pass http://__T3_SERVER_UPSTREAM__;
            }

            location / {
                proxy_pass http://webui:5733;
            }
        }
        NGXEOF
        sed -i "s|__T3_SERVER_UPSTREAM__|$${SERVER_UPSTREAM}|g" /etc/nginx/conf.d/default.conf
        sed -i "s|__T3_AUTH_SNIPPET__|$${AUTH_SNIPPET}|g" /etc/nginx/conf.d/default.conf
        sed -i "s|__T3_AUTH_HEADER__|$${AUTH_HEADER}|g" /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'
    restart: unless-stopped

  webui:
    image: ${WEBUI_IMAGE:-ryandj3/t3-webui:latest}
    build:
      context: .
      dockerfile: docker/webui.Dockerfile
    environment:
      VITE_WS_URL: wss://aicoder.propriotec.app/ws
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5733/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 20
    restart: unless-stopped

volumes:
  t3_ssl:
